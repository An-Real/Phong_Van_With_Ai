<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký Tài khoản</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .form-container { max-width: 400px; margin: 0 auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="email"], select { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background-color: #004aad; color: white; padding: 10px 15px; border: none; cursor: pointer; width: 100%; }
        button:hover { background-color: #003080; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Đăng ký Hệ thống</h2>

    <!-- Form này sẽ gửi dữ liệu (POST) lên địa chỉ /register -->
    <!-- Đối tượng 'newUser' được liên kết với form này -->
    <form th:action="@{/register}" th:object="${newUser}" method="POST">

        <div class="form-group">
            <label for="email">Email của bạn:</label>
            <!-- Thẻ th:field sẽ tự động gán giá trị người dùng gõ vào thuộc tính 'email' của class User -->
            <input type="email" id="email" th:field="*{email}" required placeholder="vidu@email.com" />
        </div>

        <div class="form-group">
            <label for="role">Bạn là:</label>
            <!-- Thẻ th:field sẽ tự động gán giá trị người dùng gõ vào thuộc tính 'role' của class User -->
            <select id="role" th:field="*{role}">
                <option value="CANDIDATE">Ứng viên tìm việc</option>
                <option value="EMPLOYER">Nhà tuyển dụng</option>
            </select>
        </div>

        <button type="submit">Đăng ký ngay</button>
    </form>
</div>

</body>
</html>
