<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bảng tin Việc làm</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; }
        .nav-menu { background: #004aad; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
        .nav-menu a { color: white; text-decoration: none; margin-right: 20px; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #f8f9fa; color: #004aad; }
        .clickable-row { cursor: pointer; transition: background-color 0.2s; }
        .clickable-row:hover { background-color: #e9ecef; }
    </style>
</head>
<body>
<div class="nav-menu">
    <a href="/candidate/job-board">Bảng tin Việc làm</a>
    <a href="/candidate/applied-jobs">Công ty đã nộp</a>
    <a href="/candidate/profile">Hồ sơ cá nhân</a>
    <a href="/logout" style="float: right; color: #ffcccc;">Đăng xuất</a>
</div>

<h2 style="color: #004aad;">Các vị trí đang tuyển dụng</h2>
<p style="color: #666; font-style: italic;">(Nhấp vào công việc để xem chi tiết và Ứng tuyển)</p>

<table>
    <thead>
    <tr>
        <th>Ngày đăng</th>
        <th>Công ty</th>
        <th>Lĩnh vực</th>
        <th>Vị trí</th>
        <th>Vai trò</th>
        <th>Cấp bậc</th>
        <th>Địa điểm</th>
        <th>Hình thức</th>
        <th>Số lượng</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="info : ${boardList}" class="clickable-row"
        th:data-url="@{/candidate/job-board/detail(jobId=${info.job.id})}"
        onclick="window.location.href=this.getAttribute('data-url')">
        <td th:text="${info.job.createdAt != null ? #temporals.format(info.job.createdAt, 'dd/MM/yyyy') : 'Mới'}"></td>
        <td th:text="${info.employer != null and info.employer.companyInfo != null ? info.employer.companyInfo.companyName : 'Chưa cập nhật'}"></td>
        <td th:text="${info.employer != null and info.employer.companyInfo != null ? info.employer.companyInfo.industry : 'Chưa cập nhật'}"></td>
        <td th:text="${info.job.title}" style="color: #004aad; font-weight: bold;"></td>
        <td th:text="${info.job.roleType}"></td>
        <td th:text="${info.job.level}"></td>
        <td th:text="${info.job.location}"></td>
        <td th:text="${info.job.jobType}"></td>
        <!-- Số lượng này sẽ tự giảm khi có người đậu -->
        <td th:text="${info.job.headcount}"></td>
    </tr>
    <tr th:if="${#lists.isEmpty(boardList)}">
        <td colspan="9" style="text-align: center; padding: 20px;">Hiện tại chưa có công việc nào.</td>
    </tr>
    </tbody>
</table>
</body>
</html>
