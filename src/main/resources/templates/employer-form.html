<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bảng điều khiển Doanh nghiệp</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { color: #004aad; border-bottom: 2px solid #004aad; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input[type="text"], textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #004aad; color: white; padding: 15px 20px; border: none; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background-color: #003080; }
        .nav-bar { text-align: right; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-menu" style="background: #004aad; padding: 15px; border-radius: 5px; margin-bottom: 20px;">
        <a href="/employer/jobs" style="color: white; text-decoration: none; margin-right: 20px; font-weight: bold;">Quản lý Bài đăng</a>
        <a href="/employer/applicants" style="color: white; text-decoration: none; margin-right: 20px; font-weight: bold;">Danh sách Ứng viên</a>
        <a href="/employer/interviews" style="color: white; text-decoration: none; margin-right: 20px; font-weight: bold;">Danh sách Phỏng vấn</a>
        <a href="/employer/dashboard" style="color: white; text-decoration: none; margin-right: 20px; font-weight: bold;">Hồ sơ Công ty</a>
        <a href="/logout" style="float: right; color: #ffcccc; font-weight: bold; text-decoration: none;">Đăng xuất</a>
    </div>

    <p th:if="${param.success}" style="color: green; font-weight: bold; text-align: center;">Cập nhật thông tin Công ty thành công!</p>

    <form th:action="@{/employer/profile}" th:object="${employer}" method="POST">

        <!-- Các trường ẩn để giữ nguyên tài khoản -->
        <input type="hidden" th:field="*{id}" />
        <input type="hidden" th:field="*{role}" />
        <input type="hidden" th:field="*{email}" />
        <input type="hidden" th:field="*{password}" />

        <fieldset th:disabled="${!editMode}" style="border: none; padding: 0; margin: 0;">
            <h2>Hồ sơ Doanh nghiệp</h2>

            <div class="form-group">
                <label>Tên Công ty:</label>
                <input type="text" th:field="*{companyInfo.companyName}" required />
            </div>

            <div class="form-group">
                <label>Email:</label>
                <input type="email" th:field="*{email}" readonly style="background-color: #e9ecef; cursor: not-allowed;" />
            </div>

            <div class="form-group">
                <label>Lĩnh vực hoạt động:</label>
                <input type="text" th:field="*{companyInfo.industry}" placeholder="VD: Phần mềm, Ngân hàng..." />
            </div>

            <div class="form-group">
                <label>Mô tả ngắn gọn:</label>
                <textarea th:field="*{companyInfo.description}" rows="4"></textarea>
            </div>

            <div class="form-group">
                <label>Website:</label>
                <input type="text" th:field="*{companyInfo.website}" />
            </div>
        </fieldset>

        <div th:if="${editMode}" style="display: flex; gap: 10px; margin-top: 20px;">

            <button type="submit"
                    style="flex: 1;
                   height: 44px;
                   padding: 0;
                   margin: 0;
                   background-color: #28a745;
                   color: white;
                   border: none;
                   border-radius: 4px;
                   font-weight: bold;
                   cursor: pointer;
                   box-sizing: border-box;">
                Lưu Hồ Sơ
            </button>

            <a href="?edit=false"
               style="flex: 1;
              height: 44px;
              padding: 0;
              margin: 0;
              background-color: #6c757d;
              color: white;
              text-align: center;
              text-decoration: none;
              font-weight: bold;
              border-radius: 4px;
              box-sizing: border-box;
              display: flex;
              align-items: center;
              justify-content: center;">
                Hủy
            </a>

        </div>

        <div th:unless="${editMode}" style="margin-top: 20px;">
            <!-- Nút bật chế độ sửa -->
            <a href="?edit=true" style="display: block; background-color: #004aad; color: white; text-align: center; padding: 15px; border-radius: 4px; text-decoration: none; font-weight: bold;">Chỉnh sửa Hồ sơ</a>
        </div>
    </form>
</div>

</body>
</html>
