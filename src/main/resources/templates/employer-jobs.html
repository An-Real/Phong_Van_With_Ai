<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Bài đăng</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; }
        .nav-menu { background: #004aad; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
        .nav-menu a { color: white; text-decoration: none; margin-right: 20px; font-weight: bold; }
        .nav-menu a:hover { text-decoration: underline; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }

        /* Cấu trúc Header Flexbox */
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px solid #004aad; padding-bottom: 10px; }
        .btn-create { background-color: #28a745; color: white; padding: 10px 20px; text-decoration: none; font-weight: bold; border-radius: 4px; }
        .btn-create:hover { background-color: #218838; }

        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #f8f9fa; color: #004aad; }

        .clickable-row { cursor: pointer; transition: background-color 0.2s; }
        .clickable-row:hover { background-color: #e9ecef; }
    </style>
</head>
<body>
<div class="nav-menu">
    <a href="/employer/jobs">Quản lý Bài đăng</a>
    <a href="/employer/applicants">Danh sách Ứng viên</a>
    <a href="/employer/interviews">Danh sách Phỏng vấn</a>
    <a href="/employer/dashboard">Hồ sơ Công ty</a>
    <a href="/logout" style="float: right; color: #ffcccc;">Đăng xuất</a>
</div>

<p th:if="${param.success}" style="color: green; font-weight: bold;">Lưu bài đăng tuyển dụng thành công!</p>
<p th:if="${param.deleted}" style="color: red; font-weight: bold;">Đã xóa bài đăng.</p>

<div class="container">
    <!-- Khối Header chứa Tiêu đề và Nút Tạo mới -->
    <div class="page-header">
        <h2 style="color: #004aad; margin: 0;">Các vị trí đang mở</h2>
        <a href="/employer/jobs/create" class="btn-create">+ Tạo Bài Đăng</a>
    </div>

    <table>
        <thead>
        <tr>
            <th>Ngày đăng</th>
            <th>Tiêu đề</th>
            <th>Cấp bậc</th>
            <th>Địa điểm</th>
            <th>Hình thức</th>
            <th>Số lượng</th>
        </tr>
        </thead>
        <tbody>
        <!-- Bấm vào hàng sẽ nhảy sang trang chi tiết -->
        <tr th:each="job : ${myJobs}" class="clickable-row"
            th:data-url="@{/employer/jobs/detail(jobId=${job.id})}"
            onclick="window.location.href=this.getAttribute('data-url')">
            <td th:text="${job.createdAt != null ? #temporals.format(job.createdAt, 'dd/MM/yyyy HH:mm') : 'Chưa rõ'}"></td>
            <td th:text="${job.title}" style="font-weight: bold; color: #004aad;"></td>
            <td th:text="${job.level}"></td>
            <td th:text="${job.location}"></td>
            <td th:text="${job.workFormat}"></td>
            <td th:text="${job.headcount}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(myJobs)}">
            <td colspan="5" style="text-align: center; padding: 20px;">Chưa có bài đăng nào.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
