<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết Bài đăng</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { color: #004aad; border-bottom: 2px solid #004aad; padding-bottom: 10px; margin-top: 20px; }
        .row-detail { margin-bottom: 15px; font-size: 16px; line-height: 1.5; }
        .label { font-weight: bold; color: #333; width: 180px; display: inline-block; }
        .content-box { background: #fdfdfd; padding: 15px; border: 1px solid #ddd; border-radius: 4px; margin-top: 5px; white-space: pre-wrap; }

        .action-bar { display: flex; gap: 15px; margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px; }
        .btn { flex: 1; padding: 15px; border: none; border-radius: 4px; font-weight: bold; font-size: 16px; cursor: pointer; text-align: center; text-decoration: none; color: white; display: block;}
        .btn-apply { background-color: #004aad; }
        .btn-apply:hover { background-color: #003080; }
        .btn-cancel { background-color: #dc3545; }
        .btn-cancel:hover { background-color: #c82333; }
        .btn-back { background-color: #6c757d; }
    </style>
</head>
<body>
<div class="container">
    <h2 style="color: #004aad; border-bottom: 2px solid #004aad; padding-bottom: 10px; margin-top: 0;">Hồ sơ Doanh nghiệp</h2>
    <div class="row-detail"><span class="label">Tên Công ty:</span> <span class="content-text" th:text="${employer.CompanyInfo.companyName}" style="font-weight: bold;"></span></div>
    <div class="row-detail"><span class="label">Email:</span> <span class="content-text" th:text="${employer.email}"></span></div>
    <div class="row-detail"><span class="label">Lĩnh vực hoạt động:</span> <span class="content-text" th:text="${employer.CompanyInfo.industry}"></span></div>
    <div class="row-detail"><span class="label">Mô tả ngắn gọn:</span>
        <div class="content-box" th:text="${employer.CompanyInfo.description}"></div>
    </div>
    <div class="row-detail"><span class="label">Website:</span> <span class="content-text" th:text="${employer.CompanyInfo.website}"></span></div>

    <h2 style="color: #004aad; border-bottom: 2px solid #004aad; padding-bottom: 10px; margin-top: 30px;">Thông tin Công việc</h2>
    <div class="row-detail"><span class="label">Tiêu đề:</span> <span class="content-text" th:text="${job.title}" style="color: #004aad; font-weight: bold; font-size: 18px;"></span></div>
    <div class="row-detail"><span class="label">Loại vai trò:</span> <span class="content-text" th:text="${job.roleType}"></span></div>
    <div class="row-detail"><span class="label">Loại việc làm:</span> <span class="content-text" th:text="${job.jobType}"></span></div>
    <div class="row-detail"><span class="label">Cấp bậc:</span> <span class="content-text" th:text="${job.level}"></span></div>
    <div class="row-detail"><span class="label">Địa điểm:</span> <span class="content-text" th:text="${job.location}"></span></div>
    <div class="row-detail"><span class="label">Hình thức:</span> <span class="content-text" th:text="${job.workFormat}"></span></div>
    <div class="row-detail"><span class="label">Số lượng cần tuyển:</span> <span class="content-text" th:text="${job.headcount}"></span></div>
    <div class="row-detail"><span class="label">Yêu cầu kinh nghiệm:</span> <span class="content-text" th:text="${job.experienceRequired}"></span></div>

    <div class="row-detail"><span class="label">Yêu cầu Kỹ năng/Học vấn:</span>
        <div class="content-box" th:text="${job.educationRequired}"></div>
    </div>
    <div class="row-detail"><span class="label">Mô tả công việc:</span>
        <div class="content-box" th:text="${job.jobDescription}"></div>
    </div>
    <div class="row-detail"><span class="label">Quyền lợi:</span>
        <div class="content-box" th:text="${job.benefits}"></div>
    </div>

    <!-- Thanh nút hành động thay đổi linh hoạt -->
    <div class="action-bar">
        <!-- Nếu chưa nộp (app == null) -->
        <form th:if="${app == null}" th:action="@{/candidate/apply}" method="POST" style="flex: 1;">
            <input type="hidden" name="jobId" th:value="${job.id}" />
            <button type="submit" class="btn btn-apply" style="width: 100%;">Ứng Tuyển Ngay</button>
        </form>

        <!-- Nếu đã nộp (app != null) => Hiện nút Hủy -->
        <form th:if="${app != null and app.status == 'APPLIED'}" th:action="@{/candidate/applied-jobs/cancel}" method="POST" style="flex: 1;">
            <input type="hidden" name="appId" th:value="${app.id}" />
            <button type="submit" class="btn btn-cancel" style="width: 100%;" onclick="return confirm('Hủy ứng tuyển vị trí này?');">Hủy Ứng Tuyển</button>
        </form>

        <a href="/candidate/job-board" class="btn btn-back">Quay Lại</a>
    </div>
</div>
</body>
</html>
